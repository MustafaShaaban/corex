name: Docs

# Rebuild the documentation site on deploy: regenerate the per-class reference from source
# (so it can never drift — DECISIONS #50) and build the Astro/Starlight site (spec 022/028).
on:
  push:
    branches: [main]
    paths:
      - 'plugins/**'
      - 'packages/**'
      - 'addons/**'
      - 'docs-app/**'
      - 'scripts/generate-docs.php'
      - 'scripts/check-docs-host.mjs'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one in flight: a half-applied Pages deploy
# serves a site whose assets and pages come from different builds.
concurrency:
  group: pages
  cancel-in-progress: false

# Both jobs run in the framework's own repository and nowhere else. A client repository is a copy
# of this one and inherits this file, and the documentation it would deploy is the framework's,
# not the client's (spec 102). The repository is written out because an expression cannot read
# `.github/repository-ownership.json`; `tests/repository-ownership.test.js` holds the two together.
jobs:
  build:
    if: github.repository == 'MustafaShaaban/corex'
    name: Regenerate reference + build docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-progress

      # Headless equivalent of `wp corex docs:generate` — needs no WordPress, only the source.
      - name: Generate the class reference
        run: composer docs:generate

      # The address the site is served from, as GitHub Pages reports it: the project page
      # (`https://mustafashaaban.github.io`, base `/corex`) or the custom domain (base empty,
      # the domain's root). The build is made for that address, so setting or removing the
      # custom domain in the repository's settings needs only this workflow to run again, and
      # the site is never built for one address and served from another (spec 130).
      - name: Read the Pages address
        id: pages
        uses: actions/configure-pages@v6

      - name: Build the documentation site
        working-directory: docs-app
        env:
          COREX_DOCS_SITE: ${{ steps.pages.outputs.origin }}
          COREX_DOCS_BASE: ${{ steps.pages.outputs.base_path }}
        run: |
          npm ci
          npm run build

      # Kept alongside the Pages artifact: a downloadable build is what lets somebody
      # inspect or self-host the site without a Pages deployment (docs/en/05-deployment).
      - name: Upload the built site
        uses: actions/upload-artifact@v7
        with:
          name: corex-docs-site
          path: docs-app/dist
          if-no-files-found: error

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs-app/dist

  deploy:
    if: github.repository == 'MustafaShaaban/corex'
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts

      # The published site as a reader reaches it: its pages, styles and search load at the
      # address it was built for, and plain HTTP is sent to HTTPS. Once the site has moved off
      # the project page, every page read must also be reached from its old `github.io/corex/`
      # address, which released admins still link to (spec 130, SC-001 and SC-002).
      - name: Check the published site
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          PROJECT_PAGE: https://mustafashaaban.github.io/corex/
        run: |
          # An http:// address means HTTPS is not enforced yet, and a site built for it names http
          # links; fail rather than publish that as checked (spec 130, FR-006).
          case "$PAGE_URL" in
            https://*) ;;
            *) echo "::error::Pages serves $PAGE_URL, not over HTTPS. Enforce HTTPS in the repository's Pages settings and run this workflow again."; exit 1 ;;
          esac
          if [ "$PAGE_URL" = "$PROJECT_PAGE" ]; then
            node scripts/check-docs-host.mjs "$PAGE_URL" --retries 4
          else
            node scripts/check-docs-host.mjs "$PAGE_URL" --moved-from "$PROJECT_PAGE" --retries 4
          fi
