name: Docs

# Rebuild the documentation site on deploy: regenerate the per-class reference from source
# (so it can never drift — DECISIONS #50) and build the Astro/Starlight site (spec 022/028).
on:
  push:
    branches: [main]
    paths:
      - 'plugins/**'
      - 'packages/**'
      - 'addons/**'
      - 'docs-app/**'
      - 'scripts/generate-docs.php'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one in flight: a half-applied Pages deploy
# serves a site whose assets and pages come from different builds.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Regenerate reference + build docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-progress

      # Headless equivalent of `wp corex docs:generate` — needs no WordPress, only the source.
      - name: Generate the class reference
        run: composer docs:generate

      - name: Build the documentation site
        working-directory: docs-app
        run: |
          npm ci
          npm run build

      # Kept alongside the Pages artifact: a downloadable build is what lets somebody
      # inspect or self-host the site without a Pages deployment (docs/en/05-deployment).
      - name: Upload the built site
        uses: actions/upload-artifact@v7
        with:
          name: corex-docs-site
          path: docs-app/dist
          if-no-files-found: error

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs-app/dist

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
