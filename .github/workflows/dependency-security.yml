name: Dependency Security

on:
  # Every pull request, and deliberately no `paths:` filter.
  #
  # It had one, listing the manifests and the policy file, which reads as an obvious economy: only
  # a change to a manifest can change what is installed. But an advisory is published by somebody
  # else, at a time nobody here chooses, against a dependency tree that did not move. Between
  # v0.41.0 and 2026-09-04 four were published, the gate reported FAIL on `main`, and nothing ran
  # it — because the filter meant it was consulted only by the pull requests least likely to be
  # looking for it. PROJECT-STATUS.md went on saying "none open" the whole time.
  #
  # The filter also made this check impossible to *require*: a required check that never reports
  # leaves a pull request pending forever, so a docs-only change would have hung. Running it on
  # every pull request is what makes the branch protection honest. It costs about four minutes.
  #
  # The weekly schedule stays, because a week with no pull requests is exactly the week an
  # advisory lands unnoticed.
  pull_request:
  schedule:
    - cron: '17 4 * * 3'
  workflow_dispatch:

permissions:
  contents: read

# This job runs in the framework's own repository and nowhere else, on every kind of event. A client
# repository is a copy of this one and inherits this file. What the audit reports is in the
# framework's lockfiles, and the two remedies — a newer package, or an exception in the policy
# file — are both edits to framework-owned paths. A client can make neither, so there it was a red
# check on every pull request, waiting for a framework release (issue #239). It used to be confined
# for scheduled runs only. The repository is written out because an expression cannot read
# `.github/repository-ownership.json`; `tests/repository-ownership.test.js` holds the two together.
jobs:
  audit:
    if: github.repository == 'MustafaShaaban/corex'
    name: Validate dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Validate dependency security policy
        run: npm run verify:dependencies
