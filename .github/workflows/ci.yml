name: CI

on:
  push:
    branches: [main, develop]
  # Every pull request, whatever its base. Filtering to [main, develop] meant a stacked PR — one
  # whose base is another feature branch — never ran CI at all, and GitHub renders "no checks" the
  # same way it renders "all checks passed". Spec 072's stack sat queued for merge that way with
  # eight real unit failures in it (DECISIONS #153).
  pull_request:
  # WordPress is installed with `--version=latest` (see .github/actions/provision-wordpress), so
  # this repository's CI result is a function of two inputs and only one of them is in git. When
  # core went 7.0.4 -> 7.1 it took two browser specs with it, and `main` stayed green-looking
  # because nothing had been pushed to it — the breakage surfaced three weeks later on an
  # unrelated dependency PR, which is the worst place to read it.
  #
  # A nightly run against `main` puts the discovery where it belongs. Pinning core would be the
  # other answer and it is the wrong one: CoreX advertises WP 7.0+, and a pin converts "we are
  # broken on current WordPress" from a failing check into something nobody finds out about.
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: read

# Every job below carries the same condition: a scheduled run happens in the framework's own
# repository and nowhere else. A client repository is a copy of this one and inherits this file,
# and the schedule exists to catch *this* repository drifting against the world — which is not a
# client's to find out, nightly, in a repository whose subject is one site (spec 102). Pull-request
# and push runs are unaffected. The repository is written out because an expression cannot read
# `.github/repository-ownership.json`; `tests/repository-ownership.test.js` holds the two together.
jobs:
  test:
    if: github.event_name != 'schedule' || github.repository == 'MustafaShaaban/corex'
    name: Lint + headless tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.3']
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Lint PHP source
        run: find plugins packages addons -name '*.php' -print0 | xargs -0 -n1 -P4 php -l

      - name: Headless unit tests (Pest)
        run: composer test

  js:
    if: github.event_name != 'schedule' || github.repository == 'MustafaShaaban/corex'
    name: Lint + JS unit tests (Jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Both linters run here rather than in a job of their own: this job already has the Node
      # install they need, and a separate job would pay for a second `npm ci` on every PR to say
      # the same thing. They run BEFORE Jest so a formatting failure is reported as a formatting
      # failure rather than as a red test job.
      #
      # Neither was gated until now, which is how spec 074 introduced 44 stylelint errors that had
      # to be found by hand, and how `lint:js` accumulated 2589 problems: `wp-scripts lint-js` with
      # no project config walked `wp/` and `dist/` — tens of thousands of files that are not ours —
      # and never finished, so it could not be gated at all until eslint.config.js scoped it.
      - name: Lint styles
        run: npm run lint:css

      - name: Lint JavaScript
        run: npm run lint:js

      # The docs site is built here so `tests/docs-links.test.js` has something to check. That test
      # skips itself when `docs-app/dist` is absent — right for a developer who has never built the
      # docs, and useless in CI, where a silently skipped link check is how 85 broken links reached
      # production in the first place (spec 092). `docs.yml` builds too, but only on push to main,
      # which is after the merge that would publish them.
      #
      # The class reference is generated first, and that is the point. Without it this step built
      # **55 pages while `docs.yml` publishes 922** — so the link check ran over six per cent of the
      # site and reported green for the other ninety-four. That is spec 092's defect exactly: a real
      # check sampling only the half that works. It needs PHP, which this job otherwise does not
      # have, and that is the whole reason it was missing.
      - name: Set up PHP for the reference generator
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      # `scripts/generate-docs.php` requires `vendor/autoload.php` — it reflects over the real
      # classes rather than parsing the files as text, which is what makes the reference accurate.
      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-progress

      - name: Generate the class reference
        run: composer docs:generate

      - name: Build the docs site
        working-directory: docs-app
        run: |
          npm ci
          npm run build

      # Covers the block/admin JS *and* the generated-artifact contracts — the token inventory
      # test regenerates from source and fails if a committed artifact drifted. Nothing in CI ran
      # this suite before, which is how a stale inventory survived spec 072's CSS additions
      # unnoticed while the gate reported every suite green.
      - name: JS unit tests (Jest)
        run: npm run test:js

  # The integration suite boots the framework inside a real WordPress (tests/bootstrap-integration
  # requires ./wp/wp-load.php), so CI has to provision one. This mirrors scripts/setup-wordpress.ps1
  # — the documented local setup — step for step, with symlinks where that script uses junctions.
  integration:
    if: github.event_name != 'schedule' || github.repository == 'MustafaShaaban/corex'
    name: Integration tests (real WordPress)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: corex
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/provision-wordpress

      - name: Integration tests (Pest, real WordPress)
        run: composer test:integration

  integration-multisite:
    if: github.event_name != 'schedule' || github.repository == 'MustafaShaaban/corex'
    name: Integration tests (real WordPress Multisite)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: corex
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/provision-wordpress
        with:
          multisite: 'true'
          path: wp-ms
          db-prefix: cxms_

      - name: Integration tests (Pest, real WordPress Multisite)
        run: composer test:multisite

  # The Playwright specs assert contracts nothing else can: the drawer's focus trap, Escape
  # returning focus to the bell, the RTL flip, and that the toolbar entry and header bell never
  # appear together. They needed a served site, so they only ever ran on a developer's machine.
  e2e:
    if: github.event_name != 'schedule' || github.repository == 'MustafaShaaban/corex'
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: corex
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/provision-wordpress
        with:
          # Must match how the site is served below, or WordPress redirects away from it.
          site-url: http://127.0.0.1:8080

      # Fixtures the browser specs need but a fresh install has no reason to contain. Each one
      # removed from the exclusion list in tests/e2e/playwright.config.js is seeded here.
      # The mu-plugin fixtures, each saying in its own docblock what it is for. One is a plugin
      # CoreX has never heard of, registering a guide through the public `corex_guides` filter
      # (spec 097, FR-008). One answers core's update check for a request that asks it to: core
      # prints its update nag only while an update is pending, and this job installs the latest
      # WordPress, where none is, so without it admin-core-notices.spec.js would meet no nag here.
      # Mu-plugins, so they are active with no activation step — and committed files rather than
      # heredocs here, so the same fixtures serve a local run.
      #
      # By pattern, not by name: scripts/setup-wordpress.ps1 copies the same pattern into the
      # framework's development install, so a fixture added to that directory reaches both without
      # a line here.
      - name: Install the browser-test mu-plugin fixtures
        run: |
          mkdir -p wp/wp-content/mu-plugins
          cp tests/e2e/fixtures/corex-e2e-*.php wp/wp-content/mu-plugins/

      - name: Seed browser-test fixtures
        run: |
          # /contact/ carrying the registered contact form. corex/form with no flowId or flowSlug
          # falls through to the registry form named by formSlug, which defaults to "contact".
          wp post create --path=wp --post_type=page --post_status=publish \
            --post_title=Contact --post_name=contact --post_content='<!-- wp:corex/form /-->'

          # Stored submissions, for the Submissions inbox and the Data source-records spec. Shape
          # taken from WpSubmissionsReader: private posts, the form slug in corex_form_slug, one
          # corex_field_* per field, and no corex_is_test flag (test rows are filtered out).
          for i in 1 2 3; do
            id=$(wp post create --path=wp --post_type=corex_submission --post_status=private \
              --post_title="Contact submission ${i}" --porcelain)
            wp post meta set "$id" corex_form_slug contact --path=wp
            wp post meta set "$id" corex_field_name "Fixture ${i}" --path=wp
            wp post meta set "$id" corex_field_email "fixture${i}@example.com" --path=wp
            wp post meta set "$id" corex_field_message "Seeded for CI run ${i}." --path=wp
          done

          # A real low-privilege user, for the access-request specs (spec 079). The whole flow is
          # about what somebody without access sees, and an administrator with a capability
          # filtered away is not that — the menu gate, the 403 and the request form all branch on
          # what WordPress registered for this user at admin_menu time.
          wp user create corex-requester requester@example.test \
            --role=subscriber --user_pass='CorexE2E!requester1' --path=wp

          # An editor, for the admin-error matrix (spec 083). Two roles only prove the extremes —
          # everything refused, or nothing refused. The interesting case is the middle: an editor
          # opens edit.php normally and is refused at plugins.php, so a handler that over-brands a
          # page the viewer may actually see fails here and nowhere else.
          wp user create corex-editor editor@example.test \
            --role=editor --user_pass='CorexE2E!editor1' --path=wp

          # A second editor, for the guides specs — one fixture user per spec file that signs in
          # (spec 095).
          #
          # CoreX locks an account out after repeated logins from one address, which is its job. Two
          # spec files signing in as the *same* editor from the CI runner's single IP trip that
          # between them, and the failure surfaces as "could not sign in" in whichever file happens
          # to run second — nowhere near the cause. It took down admin-errors.spec.js on a pull
          # request that changed no browser test at all.
          #
          # guides.spec.js already carried a comment predicting exactly this, about corex-requester.
          # The prediction was right; the remedy was never generalised.
          wp user create corex-guides-editor guides-editor@example.test \
            --role=editor --user_pass='CorexE2E!editor1' --path=wp

          # An editor and a subscriber for the Coming soon spec (spec 101), which is about exactly
          # the difference between them: somebody who can edit posts is served the real site, and
          # somebody who cannot is a visitor. Its own two, for the reason given above.
          wp user create corex-soon-editor soon-editor@example.test \
            --role=editor --user_pass='CorexE2E!soon-editor1' --path=wp
          wp user create corex-soon-subscriber soon-subscriber@example.test \
            --role=subscriber --user_pass='CorexE2E!soon-subscriber1' --path=wp

          # Turn off the editor welcome guide. It overlays the inserter the first time a user opens
          # the block editor and then stays dismissed, so without this the first editor spec fails
          # however long it waits while every later one passes — which is exactly what CI showed.
          wp user meta update admin wp_persisted_preferences \
            '{"core/edit-post":{"welcomeGuide":false},"core/edit-site":{"welcomeGuide":false},"core":{"welcomeGuide":false}}' \
            --format=json --path=wp

          wp post list --path=wp --post_type=page --fields=post_name,post_status
          wp post list --path=wp --post_type=corex_submission --post_status=private --fields=ID,post_title

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      # The admin bundles are gitignored, so the drawer does not exist until they are built.
      - name: Build the admin bundles
        run: npm run build

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      # nginx + php-fpm rather than `php -S`. The built-in server could not bring the block editor
      # up at all — the editor element never appeared, with no console error and nothing 404ing, so
      # it was not a missing asset or a starved worker pool. A real server also gives proper rewrite
      # routing instead of the built-in server's blanket index.php fallback.
      - name: Serve WordPress
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nginx php8.3-fpm
          sudo tee /etc/nginx/sites-available/default > /dev/null <<NGINX
          server {
            listen 8080 default_server;
            root ${GITHUB_WORKSPACE}/wp;
            index index.php;
            location / { try_files \$uri \$uri/ /index.php?\$args; }
            location ~ \.php\$ {
              include snippets/fastcgi-php.conf;
              fastcgi_pass unix:/run/php/php8.3-fpm.sock;
              fastcgi_read_timeout 120;
            }
          }
          NGINX
          # nginx runs as www-data and has to traverse the runner's home to reach the workspace.
          chmod o+x /home/runner /home/runner/work "${GITHUB_WORKSPACE}" || true
          # Tell PHP where its error log is, rather than leave it to the image. The first run that
          # collected the server logs found nginx's error log empty, which proves nothing either
          # way about where a message would have gone.
          sudo touch /var/log/corex-php-error.log
          sudo chown www-data:www-data /var/log/corex-php-error.log
          echo 'php_admin_flag[log_errors] = on' | sudo tee -a /etc/php/8.3/fpm/pool.d/www.conf > /dev/null
          echo 'php_admin_value[error_log] = /var/log/corex-php-error.log' | sudo tee -a /etc/php/8.3/fpm/pool.d/www.conf > /dev/null
          # No JIT. The runner's php-fpm came with the tracing JIT on and a 256 MB buffer, which
          # this job never asked for and PHP does not do by default. On 2026-10-08 a method that
          # had answered twenty-eight times began refusing a correct argument, for every worker,
          # until the run ended (see the step that prints the opcode cache's state, below). A JIT
          # is the part of PHP that rewrites a method once it has run often enough, and it is
          # the one thing in that state a default PHP does not have. That it was the cause is
          # not proved. Off, the job serves what a site serves, and the fault has one place fewer
          # to come from.
          #
          # Named to be read last. PHP reads a directory of settings in name order and the last
          # file to set a value wins; the first attempt, `99-corex-no-jit.ini`, was read and
          # overruled, which the step below is there to catch.
          echo 'opcache.jit=disable' | sudo tee /etc/php/8.3/fpm/conf.d/zzz-corex-no-jit.ini > /dev/null
          echo 'opcache.jit_buffer_size=0' | sudo tee -a /etc/php/8.3/fpm/conf.d/zzz-corex-no-jit.ini > /dev/null
          # restart, not start: installing the package already started it, with the old pool.
          sudo systemctl restart php8.3-fpm
          sudo nginx -t
          sudo systemctl restart nginx
          for _ in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:8080/; then echo "site up"; exit 0; fi
            sleep 1
          done
          echo "site never came up"
          sudo tail -50 /var/log/nginx/error.log || true
          exit 1

      # A log nobody has seen written to is a guess. One request through php-fpm writes a known
      # line, and the job stops here if it is not in the file the failure artifact will carry —
      # better to learn that on a green run than on the next 500.
      - name: Prove where PHP's error log goes
        run: |
          echo "<?php error_log( 'corex-ci-log-probe' );" > wp/corex-log-probe.php
          curl -sf -o /dev/null http://127.0.0.1:8080/corex-log-probe.php
          rm wp/corex-log-probe.php
          if ! sudo grep -q 'corex-ci-log-probe' /var/log/corex-php-error.log; then
            echo "PHP's error log is not reaching /var/log/corex-php-error.log"
            exit 1
          fi

      # The same rule for the JIT: asked of php-fpm itself, on every run, before a spec depends
      # on the answer. A file in a directory the next runner image does not read would otherwise
      # be a setting nobody has.
      - name: Prove the JIT is off
        run: |
          echo '<?php echo json_encode( array( "jit_on" => opcache_get_status( false )["jit"]["on"] ?? null, "opcache.jit" => ini_get( "opcache.jit" ), "opcache.jit_buffer_size" => ini_get( "opcache.jit_buffer_size" ), "settings_file" => php_ini_loaded_file(), "settings_read_after_it" => php_ini_scanned_files() ) );' > wp/corex-jit-probe.php
          answer=$(curl -sf http://127.0.0.1:8080/corex-jit-probe.php)
          rm wp/corex-jit-probe.php
          # Printed whatever the answer, so that where php-fpm reads its settings from is on record.
          echo "$answer" | jq . || echo "$answer"
          if [ "$(echo "$answer" | jq '.jit_on')" != "false" ]; then
            echo "php-fpm says the JIT is not off."
            exit 1
          fi

      # COREX_E2E_FRESH_INSTALL skips the specs that assume a site with content already in it —
      # published posts, built forms, stored submissions. See the list in tests/e2e/playwright.config.js;
      # seeding those fixtures here is the next step, and until then a red suite from missing content
      # would be noise rather than signal.
      - name: Playwright specs
        env:
          COREX_BASE_URL: http://127.0.0.1:8080
          COREX_ADMIN_USER: admin
          COREX_ADMIN_PASS: changeme
          COREX_E2E_FRESH_INSTALL: '1'
        run: npm run test:e2e

      # What the server said, for the failures a screenshot cannot explain.
      #
      # CoreX answers a throw behind a REST route with "Request could not be processed." and
      # writes the exception's message to the PHP error log — /var/log/corex-php-error.log here,
      # set and proved above. On 2026-10-04 three inbox specs met that 500 on a pull request that
      # changed no runtime code, and the only record of what threw stayed on a runner that no
      # longer exists.
      #
      # Collected on every run and uploaded only with a failure (the step below takes
      # test-results/). Copying four files costs nothing, and a step that runs only when
      # something has already gone wrong is a step nobody has ever seen work.
      - name: Collect the server logs
        if: ${{ !cancelled() }}
        run: |
          mkdir -p test-results/server-logs
          sudo cp /var/log/nginx/error.log test-results/server-logs/nginx-error.log || true
          sudo cp /var/log/nginx/access.log test-results/server-logs/nginx-access.log || true
          sudo cp /var/log/php8.3-fpm.log test-results/server-logs/php-fpm.log || true
          sudo cp /var/log/corex-php-error.log test-results/server-logs/php-error.log || true
          sudo chown -R "$(id -u):$(id -g)" test-results/server-logs
          wc -l test-results/server-logs/* || true

      # The same evidence, in the job's own output, where a failed run is read first.
      #
      # On 2026-10-08 eight inbox specs failed on "HTTP 500 flow_error", and what had thrown was
      # one line in an artifact that has to be asked for and expires in a week. That line said a
      # FlowVersion had been refused by a parameter declared FlowVersion, against a type PHP
      # printed as an empty string: the opcode cache's copy of the method, not the code and not
      # anything stored. The same request had answered 200 two seconds earlier, twenty-eight
      # times, and went on failing until the run ended, as a cache shared by every worker would.
      #
      # So the tail of PHP's log is printed here, and beside it what the opcode cache says about
      # itself, asked through php-fpm because the command line has a cache of its own: whether it
      # filled, whether it restarted and when, how much of its string buffer is left, and whether
      # the JIT is on. The first run that printed it is how the JIT was found on at all; an
      # ordinary run also ends with about six per cent of the string buffer free, and no restart.
      # What set the fault off is not proved. If it comes back with the JIT off, this is where
      # the next lead is.
      - name: Print the server's errors and the state of PHP's opcode cache
        if: ${{ !cancelled() }}
        run: |
          echo "::group::PHP error log, last 40 lines"
          tail -n 40 test-results/server-logs/php-error.log || true
          echo "::endgroup::"

          echo '<?php header( "Content-Type: application/json" ); echo json_encode( function_exists( "opcache_get_status" ) ? opcache_get_status( false ) : array( "opcache" => "not loaded" ) );' > wp/corex-opcache-probe.php
          curl -s -o test-results/server-logs/opcache-status.json http://127.0.0.1:8080/corex-opcache-probe.php || true
          rm -f wp/corex-opcache-probe.php
          echo "::group::OPcache status, as php-fpm reports it"
          jq . test-results/server-logs/opcache-status.json || cat test-results/server-logs/opcache-status.json || true
          echo "::endgroup::"

      - name: Upload the report when the browser tests fail
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
          if-no-files-found: ignore

  # The framework tells a team to put a client site under `sites/<client>/`, and for a long time
  # its own checks rejected exactly that: repository hygiene forbade the directory and the root
  # linters and Jest swept it. Each of those was found in a client's repository, by the client.
  #
  # This job is the framework finding it first (spec 102, FR-016). It generates a real starter
  # site with `make:site`, commits it the way a client would, and then runs everything a client
  # repository runs: the client's own tests and build, the root linters, the root Jest suite with
  # the site tracked, and the unmodified-framework check — which must pass, and must then fail on
  # one changed byte. It runs against the generator's real output rather than a fixture, because
  # the generator is the thing that changes.
  #
  # Confined to the framework's repository on every event, not only the scheduled one. This is the
  # framework testing its own generator. In a client repository it would generate a second site
  # beside the real one, recording a different baseline, and the check would rightly refuse the pair.
  client-site-layout:
    if: github.repository == 'MustafaShaaban/corex'
    name: A generated client site passes every root check
    runs-on: ubuntu-latest
    env:
      # From here on this checkout is treated as a client's repository. Without it the hygiene
      # suite would — correctly — refuse a client site committed to the framework's own.
      COREX_REPOSITORY_ROLE: client
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: corex
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/provision-wordpress

      # Exactly as the documentation writes it: from the repository root, with the site directory
      # in `--dir`. It used to be documented as `--path=sites/acme`, which never ran — WP-CLI takes
      # `--path` for itself, as the WordPress install, so the site directory never arrived and
      # WordPress was not found. Here `--path` is used for what WP-CLI means by it.
      - name: Generate a starter client site
        run: |
          set -euo pipefail
          wp corex make:site Acme --starter --dir=sites/acme --path="$GITHUB_WORKSPACE/wp"
          test -f sites/acme/corex-baseline.json
          test -f sites/acme/UPDATING-COREX.md
          test -f .github/workflows/site-acme.yml
          cat sites/acme/corex-baseline.json

      - name: Commit it, as a client repository would
        run: |
          git config user.email ci@example.com
          git config user.name CI
          git add sites .github/workflows/site-acme.yml
          git commit --quiet --message 'Add the client site'

      - name: The client's own tests run from its plugin directory
        working-directory: sites/acme/acme-site
        run: ../../../vendor/bin/pest

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Before the root install, on purpose. A client package that imports something it does not
      # declare resolves it from the framework's node_modules when those are present, and breaks
      # on the day a framework update removes it. With no root install there is nothing to borrow.
      - name: The client theme builds from a clean install, with no root node_modules
        run: |
          set -euo pipefail
          test ! -d node_modules
          cd sites/acme/acme-theme
          npm install --no-audit --no-fund
          npm run build

      # spec 101, SC-005: a new client site serves its own coming-soon page with no step other
      # than switching its theme on and switching the mode. The page is edited in the client's
      # repository first, so what is asserted is that *that file* is what a visitor is sent —
      # not CoreX's default, which says the same words until somebody changes them.
      - name: The generated site serves its own coming-soon page
        run: |
          set -euo pipefail
          WP="$GITHUB_WORKSPACE/wp"
          ln -sfn "$GITHUB_WORKSPACE/sites/acme/acme-theme" "$WP/wp-content/themes/acme-theme"
          test -f sites/acme/acme-theme/templates/coming-soon.html
          sed -i 's|Coming soon</h1>|Acme opens in spring</h1>|' sites/acme/acme-theme/templates/coming-soon.html

          wp theme activate acme-theme --path="$WP"
          # From the command line, with the confirmation the mode needs — and refused without it.
          if wp corex mode set coming-soon --path="$WP"; then
            echo "The mode was changed without --acknowledge." >&2
            exit 1
          fi
          wp corex mode set coming-soon --acknowledge --path="$WP"
          test "$(wp corex mode get --porcelain --path="$WP")" = coming-soon

          wp server --host=127.0.0.1 --port=8081 --path="$WP" > "$RUNNER_TEMP/wp-server.log" 2>&1 &
          server=$!
          for attempt in $(seq 1 30); do
            if curl -s -o /dev/null -H 'Host: localhost' http://127.0.0.1:8081/; then break; fi
            sleep 1
          done

          # Signed out, at the home URL: 200, and the client's own page.
          status=$(curl -s -o "$RUNNER_TEMP/home.html" -w '%{http_code}' -H 'Host: localhost' http://127.0.0.1:8081/)
          test "$status" = 200 || { cat "$RUNNER_TEMP/wp-server.log"; echo "home answered $status" >&2; exit 1; }
          grep --quiet 'Acme opens in spring' "$RUNNER_TEMP/home.html"
          grep --quiet 'corex-coming-soon' "$RUNNER_TEMP/home.html"
          # Signed out, anywhere else: a temporary redirect, and none of the page.
          status=$(curl -s -o "$RUNNER_TEMP/page.html" -w '%{http_code}' -H 'Host: localhost' http://127.0.0.1:8081/sample-page/)
          test "$status" = 302 || { echo "another address answered $status" >&2; exit 1; }
          test ! -s "$RUNNER_TEMP/page.html"

          # Put the install and the working tree back as the steps below expect them.
          kill "$server"
          wp corex mode set development --path="$WP"
          wp theme activate corex --path="$WP"
          rm "$WP/wp-content/themes/acme-theme"
          git checkout -- sites/acme/acme-theme/templates/coming-soon.html

      # DECISIONS #267: the shared-host package was checked for its folders and never started, and
      # it could not load the framework. This builds it for the generated site, with the checkout's
      # development vendor/ beside it as a working checkout has, and starts WordPress from the
      # package: this job's database, the package's own files, and no symlink into the checkout.
      - name: The shared-host package of the generated site boots, and `wp corex` runs from it
        run: |
          set -euo pipefail
          npm run build:dist -- --client=acme
          npm run verify:dist
          test ! -e dist/.htaccess
          test ! -e dist/wp-content/vendor/phpunit
          test -d vendor/phpunit

          cp "$GITHUB_WORKSPACE/wp/wp-config.php" dist/wp-config.php
          wp eval 'exit(\Corex\Boot::booted() ? 0 : 1);' --path=dist
          wp eval 'echo (new ReflectionClass(\Corex\Foundation\Application::class))->getFileName();' --path=dist \
            | grep --quiet '/dist/wp-content/plugins/corex-core/src/'
          wp corex routes:list --path=dist > /dev/null
          wp plugin activate acme-site --path=dist
          wp eval 'exit(\Corex\Boot::booted() ? 0 : 1);' --path=dist
          wp plugin deactivate acme-site --path=dist
          rm -rf dist

      - name: Install the framework's dependencies
        run: npm ci

      - name: The root linters report nothing from the client site
        run: |
          npm run lint:css
          npm run lint:js

      - name: The root Jest suite passes with the site tracked, repository hygiene included
        run: npm run test:js

      - name: The framework is reported unmodified
        run: node scripts/verify-framework.mjs

      - name: One changed byte in a framework file is caught, and the file is named
        run: |
          set -euo pipefail
          printf ' ' >> README.md
          if node scripts/verify-framework.mjs > "$RUNNER_TEMP/verify.txt"; then
            cat "$RUNNER_TEMP/verify.txt"
            echo "verify:framework passed over a modified framework file." >&2
            exit 1
          fi
          cat "$RUNNER_TEMP/verify.txt"
          grep --perl-regexp '^DRIFT\tREADME\.md$' "$RUNNER_TEMP/verify.txt"

# Not yet wired here (tracked in CONTRIBUTING.md):
#   - The guard gates (clean-code/wp/test/docs) are run by the coding agent on each diff
#     per the constitution; a CI shim can enforce them once a runner exists.
#   - PHPCS (WordPress-Extra) + ESLint (@wordpress) once their configs are added.
