name: CodeQL

on:
  push:
    branches: [main, develop]
  # Unfiltered for the same reason as ci.yml: a stacked PR must not reach main unscanned.
  pull_request:
  schedule:
    - cron: '20 4 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

# A client repository is a copy of this one and inherits this file. The job runs:
#   - in the framework's own repository, on every kind of event;
#   - in a client repository on a push or a pull request, when that repository is public.
# Never on a schedule outside the framework: that run exists to catch *this* repository drifting
# against the world (spec 102). And never in a private client repository: code scanning is not
# available there without a paid plan, so the analysis ran and then failed to report, and the
# client's `main` carried a red check from its first commit (issue #239). The repository is written
# out because an expression cannot read `.github/repository-ownership.json`;
# `tests/repository-ownership.test.js` holds the two together.
jobs:
  analyze:
    if: github.repository == 'MustafaShaaban/corex' || ( github.event_name != 'schedule' && ! github.event.repository.private )
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
